<section class="hero-section" id="home">
  <div class="hero-blob hero-blob-1" aria-hidden="true"></div>
  <div class="hero-blob hero-blob-2" aria-hidden="true"></div>

  <p class="hero-eyebrow">We're getting married</p>
  <h1 class="hero-name">{{ content.names }}</h1>

  <div class="hero-photo-wrap">
    <img class="hero-photo" src="images/wedding_us_bw.jpeg" alt="Laurie and Simon" />
  </div>

  <p class="hero-date">{{ content.weddingDate }}</p>

  <div class="hero-scroll-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="28" height="28">
      <path
        d="M12 4v14m0 0l-6-6m6 6l6-6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
</section>
