<section class="event-details-section" id="event-details" appRevealOnScroll>
  <div class="corner-accent" aria-hidden="true"></div>
  <div class="section-inner">
    <div class="section-header">
      <p class="eyebrow">Save the date</p>
      <h2 class="section-title">{{ content.title }}</h2>
      <p class="event-date">{{ content.date }}</p>
    </div>

    <ol class="schedule">
      @for (item of content.schedule; track item.name) {
        <li class="schedule-item">
          <div class="schedule-time">{{ item.time }}</div>
          <div class="schedule-body">
            <h3 class="schedule-name">{{ item.name }}</h3>
            <p class="schedule-description">{{ item.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
