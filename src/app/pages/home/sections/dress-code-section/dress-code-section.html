<section class="dress-code-section" id="dress-code" appRevealOnScroll>
  <div class="section-inner">
    <p class="eyebrow">Look your best</p>
    <h2 class="section-title">{{ content.title }}</h2>
    <p class="description">{{ content.description }}</p>

    <div class="cards">
      <div class="card">
        <h3 class="card-title wear-title">What to Wear</h3>
        <ul class="wear-list">
          @for (item of content.doList; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </div>
      <div class="card">
        <h3 class="card-title avoid-title">What to Avoid</h3>
        <ul class="avoid-list">
          @for (item of content.avoidList; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
